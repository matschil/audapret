<div class="study-flex bg-light rounded">
  <div class="jumbotron-flexible">
    <br />

    <h2 align="center" class="display-5">
      Overview of your current studies
    </h2>
    <hr class="my-4" />
    <div class="study-item rounded">
      <div class="list-group">
        <a class="list-group-item list-group-item disabled">
          <div class="list-group-item-flex">
            <div class="list-group-item-item-left">
              Users
            </div>
          </div>
        </a>
        <button
          type="button"
          class="list-group-item list-group-item-action"
          *ngFor="let user of users"
          (click)="openEditUserModal(user)"
        >
          <div class="list-group-item-flex">
            <div class="list-group-item-item-left">
              {{ user.name }}
            </div>
          </div>
        </button>
      </div>
      <button
        class="btn btn-primary"
        style="background-color: #0072b8; border: #0072b8; margin-top: 10px;"
        (click)="openAddUserModal()"
      >
        Add
      </button>
      <br />
      <br />
      <form #studyForm="ngForm" (ngSubmit)="createStudy(studyForm.value)">
        <div class="form-group">
          <label>Study title</label>
          <input name="title" type="text" class="form-control" ngModel />
        </div>
        <button
          class="btn btn-primary"
          style="background-color: #0072b8; border: #0072b8;"
          type="submit"
        >
          Create Study
        </button>
      </form>
    </div>
  </div>
</div>
