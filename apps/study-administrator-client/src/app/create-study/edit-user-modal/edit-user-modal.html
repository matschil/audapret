<!-- This modal is for editing users that have already been added to a study -->
<div class="container-fluid">
  <div class="edit-user-modal-flex">
    <br />
    <font size="5">Edit User {{userToEdit.name}} </font>
    <br />
    <br />
    <form #userForm="ngForm" (ngSubmit)="onSubmit(userForm.value)">
      <div class="form-group">
        <label>Name</label>
        <input
          type="text"
          name="name"
          [(ngModel)]="userToEdit.name"
          class="form-control"
          disabled
        />
      </div>

      <div class="form-group">
        <label>Select Detail Level</label>
        <select class="custom-select" disabled>
          <option *ngFor="let detailLevel of detailLevels"
            >{{ detailLevel }}</option
          >
        </select>
      </div>

      <button
        class="btn btn-secondary"
        style="border: unset; margin-top: 10px; margin-left: 10px;"
        (click)="close()"
      >
        Close Modal
      </button>
      <button
        class="btn btn-secondary"
        (click)="removeUser(userToEdit.name)"
        style="
          background-color: #0072b8;
          border: unset;
          margin-top: 10px;
          margin-left: 10px;
        "
      >
        Remove User
      </button>
    </form>
  </div>
</div>
