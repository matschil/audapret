<div class="container-fluid">
  <br />
  <font size="5">Edit Access Grant of {{userToEdit.username}} </font>
  <br />
  <br />
  <form #userForm="ngForm" (ngSubmit)="onSubmit(userForm.value)">
    <div class="form-group">
      <label>Name of Researcher</label>
      <input
        type="text"
        name="requester"
        [(ngModel)]="userToEdit.username"
        disabled
      />
    </div>

    <div class="form-group">
      <label>Select Detail Level</label>

      <select
        name="detailLevel"
        class="custom-select"
        [(ngModel)]="userToEdit.grant.detailLevel"
      >
        <option *ngFor="let detailLevel of detailLevels"
          >{{ detailLevel }}</option
        >
      </select>
    </div>
    <button class="btn btn-primary" type="submit">Save canges</button>
    <button class="btn btn-secondary" (click)="close()">
      Close Modal
    </button>
  </form>
</div>
