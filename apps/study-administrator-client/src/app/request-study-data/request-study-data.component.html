<div class="request-data-flex">
  <div class="jumbotron-flexible">
    <br />
    <link
      rel="stylesheet"
      type="text/css"
      href="//fonts.googleapis.com/css?family=Open+Sans"
    />
    <h2 align="center" class="display-5" style="font-family: Open Sans;">
      Request User Data
    </h2>
    <p
      class="lead"
      style="font-family: Open Sans; margin-top: 15px; font-size: 20px;"
    >
      Select the user you want to view data from
    </p>
    <hr class="my-4" />
  </div>

  <div class="request-data-item-bordered" style="width: 400px;">
    <table border="1" class="table table-bordered table-striped">
      <thead>
        <tr>
          <th scope="col">
            User
          </th>
          <th scope="col">
            Type
          </th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let user of users">
          <td scope="row">
            {{ user.name }}
          </td>
          <td scope="row">
            {{ user.userType }}
          </td>
        </tr>
      </tbody>
    </table>
  </div>
  <div class="request-data-item-not-bordered" style="width: 400px;">
    <form
      #studyForm="ngForm"
      (ngSubmit)="loadData(studyForm.value.username)"
      style="margin-left: 30%; margin-bottom: 10%;"
    >
      <div class="form-group" style="width: 50%;">
        <label>Username</label>
        <input name="username" type="text" class="form-control" ngModel />
      </div>
      <button
        class="btn btn-primary"
        type="submit"
        style="background-color: #0072b8; border: #0072b8;"
      >
        Request Data
      </button>
    </form>
  </div>

  <!-- <div class="request-data-item">
    <form (ngSubmit)="loadDataFromAllUsers()">
      <button class="btn btn-primary" type="submit">
        Request Data from all Users
      </button>
    </form>
  
   --><br />
  <div *ngIf="tableInformations.length > 0" class="request-data-item-bordered">
    <div *ngFor="let tableInformation of tableInformations">
      <br />
      <!--  <div class="request-data-table-item"> -->
      <h6>{{ tableInformation.dataSource }}</h6>

      <div class="table-wrapper-scroll-y scrollbar p">
        <table
          border="1"
          class="table table-bordered table-striped"
          style="font-size: small;"
        >
          <thead>
            <tr>
              <th *ngFor="let column of tableInformation.columns" scope="col">
                {{ column }}
              </th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let row of tableInformation.rows" scope="row">
              <td *ngFor="let cell of row" scope="col">
                {{ cell }}
              </td>
            </tr>
          </tbody>
        </table>
      </div>
      <!-- </div> -->
    </div>
  </div>
</div>
