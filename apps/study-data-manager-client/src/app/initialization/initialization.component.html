<div class="initialization-flex rounded" style="background-color: #3eb489;">
  <div class="jumbotron-flexible">
    <br />
    <!-- Initialization Box -->
    <div class="initialization-item">
      <link
        rel="stylesheet"
        type="text/css"
        href="//fonts.googleapis.com/css?family=Open+Sans"
      />
      <h2 align="center" class="display-5" style="font-family: Open Sans;">
        Initialize
      </h2>
      <p
        class="lead"
        style="font-family: Open Sans; margin-top: 15px; font-size: 17px;"
      >
        Please provide your credentials below
      </p>
      <hr class="my-4" />
      <!-- Initialization Form -->
      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="username">Username</label>
          <input
            type="text"
            formControlName="username"
            class="form-control"
            [ngClass]="{ 'is-invalid': submitted && f.username.errors }"
          />
          <div *ngIf="submitted && f.username.errors" class="invalid-feedback">
            <div *ngIf="f.username.errors.required">Username is required</div>
          </div>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            formControlName="password"
            class="form-control"
            [ngClass]="{ 'is-invalid': submitted && f.password.errors }"
          />
          <div *ngIf="submitted && f.password.errors" class="invalid-feedback">
            <div *ngIf="f.password.errors.required">Password is required</div>
            <div *ngIf="f.password.errors.minlength">
              Password must be at least 6 characters
            </div>
          </div>
        </div>
        <div class="form-group" align="center">
          <button
            (ngSubmit)="onSubmit()"
            [disabled]="loading"
            class="btn btn-primary"
            style="background-color: #3eb489; border: unset;"
          >
            <span
              *ngIf="loading"
              class="spinner-border spinner-border-sm mr-1"
            ></span>
            Initialize
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
