<div class="login-flex rounded" style="background-color: #3eb489;">
  <div class="jumbotron-flexible">
    <br />
    <h2 align="center" class="display-5">
      Login
    </h2>
    <p class="lead">
      Please provide your credentials below
    </p>
    <hr class="my-4" />

    <div class="login-item">
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="username">Username</label>
          <input
            type="text"
            formControlName="username"
            class="form-control"
            [ngClass]="{ 'is-invalid': submitted && f.username.errors }"
          />
          <div *ngIf="submitted && f.username.errors" class="invalid-feedback">
            <div *ngIf="f.username.errors.required">Username is required</div>
          </div>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            formControlName="password"
            class="form-control"
            [ngClass]="{ 'is-invalid': submitted && f.password.errors }"
          />
          <div *ngIf="submitted && f.password.errors" class="invalid-feedback">
            <div *ngIf="f.password.errors.required">Password is required</div>
          </div>
        </div>
        <div class="form-group" align="center">
          <button
            [disabled]="loading"
            class="btn btn-lg btn-primary"
            style="background-color: #3eb489; border: unset; margin-top: 10px;"
          >
            <span
              *ngIf="loading"
              class="spinner-border spinner-border-sm mr-1"
            ></span>
            Login
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
