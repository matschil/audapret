<div class="data-loader-flex">
  <div class="top-item">
    <h2>View data</h2>
    <hr width="600px" size="2px" color="black" align="left" />
    Load your own data
  </div>

  <div class="data-loader-item">
    <br />
    <div *ngFor="let source of dataSources$">
      <br />
      <button (click)="loadDataFromSource(source)" class="btn btn-secondary">
        Load {{ source }} data
      </button>
    </div>
  </div>
  <div class="data-loader-item table-wrapper-scroll-y scrollbar">
    <!--div class="table-wrapper-scroll-y scrollbar"-->
    <table border="1" class="table table-bordered table-striped">
      <thead>
        <tr>
          <th *ngFor="let column of columns" scope="col">
            {{ column }}
          </th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let row of rows" scope="row">
          <td *ngFor="let cell of row" scope="col">
            {{ cell }}
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<router-outlet></router-outlet>
