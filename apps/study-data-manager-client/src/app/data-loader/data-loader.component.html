<div class="data-loader-flex">
  <div class="jumbotron-flexible">
    <br />
    <link
      rel="stylesheet"
      type="text/css"
      href="//fonts.googleapis.com/css?family=Open+Sans"
    />
    <h2 align="center" class="display-5" style="font-family: Open Sans;">
      View Data
    </h2>

    <p class="lead" style="font-family: Open Sans; font-size: 17px;">
      Select the data source you want to view data from
    </p>
    <div class="dropdown" align="center">
      <button
        class="btn btn-secondary btn-sm dropdown-toggle"
        style="background-color: #3eb489; border: #3eb489;"
        type="button"
        id="dropdownMenuButton"
        data-toggle="dropdown"
        aria-haspopup="true"
        aria-expanded="true"
      >
        Data Source
      </button>
      <div class="dropdown-menu" aria-labelledby="dropdownMenuButton">
        <div *ngFor="let source of dataSources$">
          <a
            class="dropdown-item"
            id="{{ source }}"
            (click)="loadDataFromSource(source); updateButtonText($event)"
            >{{ source }}</a
          >
        </div>
      </div>
    </div>
    <hr class="my-4" />
  </div>
  <div *ngIf="selectedDataSource" class="data-loader-item">
    <div
      class="table-wrapper-scroll-y scrollbar p"
      style="border: 1px solid lightgray; border-radius: 5px;"
      href="anchor"
    >
      <table
        class="table table-bordered table-striped"
        style="font-size: smaller;"
      >
        <thead>
          <tr>
            <th *ngFor="let column of columns" scope="col">
              {{ column }}
            </th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let row of rows" scope="row">
            <td *ngFor="let cell of row" scope="col">
              {{ cell }}
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
<router-outlet></router-outlet>
