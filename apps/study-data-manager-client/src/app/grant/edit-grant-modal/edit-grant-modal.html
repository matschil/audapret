<div class="container-fluid">
  <div class="edit-modal-flex">
    <br />
    <font size="5">Edit Access Grant of {{userToEdit.username}} </font>
    <br />
    <br />
    <form #userForm="ngForm" (ngSubmit)="onSubmit(userForm.value); close()">
      <div class="form-group">
        <label>Name of Researcher</label>
        <input
          type="text"
          name="requester"
          [(ngModel)]="userToEdit.username"
          class="form-control"
          disabled
        />
      </div>

      <div class="form-group">
        <label>Select Detail Level</label>

        <select
          name="detailLevel"
          class="custom-select"
          [(ngModel)]="userToEdit.grant.detailLevel"
        >
          <option *ngFor="let detailLevel of detailLevels"
            >{{ detailLevel }}</option
          >
        </select>
      </div>
      <button
        class="btn btn-primary"
        type="submit"
        style="
          background-color: #3eb489;
          border: unset;
          margin-top: 10px;
          margin-right: 10px;
          margin-bottom: 20px;
        "
      >
        Save canges
      </button>
      <button
        class="btn btn-secondary"
        (click)="close()"
        style="
          border: unset;
          margin-top: 10px;
          margin-left: 10px;
          margin-bottom: 20px;
        "
      >
        Close Modal
      </button>
    </form>
  </div>
</div>
