<div class="grant-flex" style="background-color: white;">
  <div class="jumbotron-flexible">
    <br />

    <link
      rel="stylesheet"
      type="text/css"
      href="//fonts.googleapis.com/css?family=Open+Sans"
    />
    <h2 align="center" class="display-5" style="font-family: Open Sans;">
      Manage your Data Access Grants
    </h2>
    <p
      class="lead"
      style="font-family: Open Sans; margin-top: 15px; font-size: 15px;"
    >
      View, add and edit your

      <span
        style="
          font-family: Open Sans Bold 800;
          font-size: 17px;
          color: #3eb489;
        "
      >
        {{ users.length }}
      </span>

      Data Access Grants to provide access to your personal Study Data
    </p>
    <hr class="my-4" />

    <div class="grant-item">
      <div class="list-group" style="padding: 0px 50px 0px 50px;">
        <a
          class="list-group-item list-group-item disabled"
          style="border: 1px solid lightgray; background-color: whitesmoke;"
        >
          <div class="list-group-item-flex" style="font-size: 15px;">
            <div class="list-group-item-item-left">
              Researcher
            </div>
            <div class="list-group-item-item-right">
              Creation date
            </div>
          </div>
        </a>
        <button
          type="button"
          class="list-group-item list-group-item-action"
          *ngFor="let user of users"
          (click)="openEditGrantModal(user)"
        >
          <div class="list-group-item-flex" style="font-size: smaller;">
            <div class="list-group-item-item-left">
              {{ user.username }}
            </div>
            <div class="list-group-item-item-right">
              {{ user.grant.createdAt | date }}
            </div>
          </div>
        </button>
      </div>
      <br />
      <button
        class="btn btn-primary grant-button"
        style="background-color: #3eb489; border: #3eb489;"
        align="center"
        (click)="openCreateGrantModal()"
      >
        Create
      </button>
    </div>
  </div>
</div>
