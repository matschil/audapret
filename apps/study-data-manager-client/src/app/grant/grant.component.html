<div class="grant-flex">
  <div class="top-item">
    <h2>Manage your Data Access Grants</h2>
    <hr width="600px" size="2px" color="black" align="left" />
  </div>

  <div class="grant-item">
    <!-- IN here: menu -->
    <div class="list-group">
      <button
        type="button"
        class="list-group-item list-group-item-action"
        *ngFor="let user of users"
        (click)="openEditGrantModal(user)"
      >
        {{ user.username }}{{ user.grant.createdAt }}
      </button>
    </div>
    <button class="btn btn-primary" (click)="openCreateGrantModal()">
      Create
    </button>
  </div>
</div>
