<form [formGroup]="bloodmarkerForm" (ngSubmit)="onSubmit()">
  <div class="form-group">
    <label>
      Ketone level:
      <input type="text" formControlName="ketoneLevels" />
    </label>
  </div>
  <div class="form-group" style="box-sizing: border-box;">
    <label>
      Blood sugar:
      <input type="text" formControlName="bloodSugar" required />
    </label>
  </div>
  <div>
    <button type="submit" [disabled]="!bloodmarkerForm.valid">Submit</button>
  </div>
</form>
